name: Downpour - Build Switch NVK SDK

on:
  workflow_dispatch:
    inputs:
      build_downpour:
        description: Build Downpour after NVK
        required: false
        default: true
        type: boolean
  push:
    branches:
      - downpour-port
    paths:
      - ".github/workflows/downpour-switch-nvk.yml"
      - "mesa/**"

jobs:
  build-nvk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout port patches
        uses: actions/checkout@v4

      - name: Checkout mesa-switch
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/danfromtico/mesa-switch.git mesa-switch
          git -C mesa-switch checkout 1a8c1a66d6f

      - name: Apply nfsmw Switch Mesa patch
        run: |
          set -euo pipefail
          cd mesa-switch
          git apply ../mesa/mesa-switch-nfsmw.patch

      - name: Build NVK Switch with upstream Docker builder
        run: |
          set -o pipefail
          cd mesa-switch
          chmod +x build-switch.sh
          ./build-switch.sh 2>&1 | tee /tmp/mesa-switch-build.log

      - name: Collect NVK SDK files
        run: |
          set -euo pipefail
          rm -rf /tmp/nvk-sdk
          mkdir -p /tmp/nvk-sdk/lib /tmp/nvk-sdk/include
          VULKAN=$(find mesa-switch -type f -name libvulkan.a | head -1)
          test -n "$VULKAN"
          cp "$VULKAN" /tmp/nvk-sdk/lib/libvulkan.a
          find mesa-switch -type f \( -name 'libnvk.a' -o -name 'libnak*.a' \) -exec cp {} /tmp/nvk-sdk/lib/ \;
          if [ -d mesa-switch/include ]; then cp -a mesa-switch/include/. /tmp/nvk-sdk/include/; fi
          # Reuse the exact devkitPro toolchain that successfully built Mesa.
          docker start mesa-switch-build >/dev/null
          rm -rf /tmp/devkitpro
          mkdir -p /tmp/devkitpro
          for d in devkitA64 libnx portlibs tools; do
            docker cp "mesa-switch-build:/opt/devkitpro/$d" "/tmp/devkitpro/$d"
          done
          docker stop mesa-switch-build >/dev/null
          ls -lh /tmp/nvk-sdk/lib/

      - name: Upload NVK SDK
        uses: actions/upload-artifact@v4
        with:
          name: downpour-switch-nvk-sdk
          path: |
            /tmp/nvk-sdk
            /tmp/devkitpro
          if-no-files-found: error
          retention-days: 7

      - name: Upload Mesa build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: downpour-switch-nvk-build-log
          path: /tmp/mesa-switch-build.log
          if-no-files-found: ignore
          retention-days: 7


  build-downpour:
    needs: build-nvk
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout port
        uses: actions/checkout@v4

      - name: Download NVK SDK
        uses: actions/download-artifact@v4
        with:
          name: downpour-switch-nvk-sdk
          path: /tmp/nvk-sdk

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang python3 git wget xz-utils zstd libx11-xcb-dev

      - name: Restore devkitPro toolchain from NVK build
        run: |
          set -euo pipefail
          DEVKIT_ROOT=/tmp/nvk-sdk/devkitpro
          test -x "$DEVKIT_ROOT/devkitA64/bin/aarch64-none-elf-g++" || chmod a+x "$DEVKIT_ROOT/devkitA64/bin/aarch64-none-elf-g++"
          sudo rm -rf /opt/devkitpro
          sudo mkdir -p /opt/devkitpro
          for d in devkitA64 libnx portlibs tools; do
            test -d "$DEVKIT_ROOT/$d"
            sudo mv "$DEVKIT_ROOT/$d" "/opt/devkitpro/$d"
          done
          sudo chmod -R a+rX /opt/devkitpro
          sudo find /opt/devkitpro/devkitA64/bin /opt/devkitpro/tools/bin -type f -exec chmod a+x {} +
          echo "DEVKITPRO=/opt/devkitpro" >> "$GITHUB_ENV"
          echo "/opt/devkitpro/tools/bin:/opt/devkitpro/devkitA64/bin" >> "$GITHUB_PATH"
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ --version

      - name: Fetch ReXGlue third-party sources
        run: |
          set -euo pipefail
          python3 tools/fetch_thirdparty.py
          rm -rf sdk/thirdparty/spirv-headers
          git clone --quiet https://github.com/KhronosGroup/SPIRV-Headers.git sdk/thirdparty/spirv-headers
          git -C sdk/thirdparty/spirv-headers checkout --quiet 29981f65241605e08b0ede4cfeb999fe3b723c6a
          python3 - <<'PY'
          from pathlib import Path
          root = Path("sdk/thirdparty")
          for child in root.iterdir():
              if child.is_dir() and any(child.iterdir()):
                  (child / ".git").mkdir(exist_ok=True)
          PY

      - name: Build host ReXGlue
        run: |
          cmake -S sdk -B out/host -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DSDL_WAYLAND=OFF -DSDL_X11=OFF -DSDL_TEST_LIBRARY=OFF \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_INSTALL=OFF
          cmake --build out/host --target rexglue -j 2

      - name: Checkout private Downpour XEX
        uses: actions/checkout@v4
        with:
          repository: gerisson1996/-downpour-assets
          token: ${{ secrets.DOWNPOUR_ASSETS_TOKEN }}
          path: _private_downpour_assets
          fetch-depth: 1
          persist-credentials: false

      - name: Generate Downpour C++
        run: |
          set -euo pipefail
          rm -rf /tmp/downpour-game /tmp/downpour-project
          mkdir -p /tmp/downpour-game /tmp/downpour-project
          install -m 600 _private_downpour_assets/default.xex /tmp/downpour-game/default.xex
          echo "c686cbff8facad6fb6b78ed98e5a5a2f4f19337ef83517f56195a56b0db2c8d7  /tmp/downpour-game/default.xex" | sha256sum -c -
          sdk/out/linux-amd64/rexglue init \
            --project-name silent_hill_downpour \
            --xex-path /tmp/downpour-game/default.xex \
            --game-root /tmp/downpour-game \
            --project-root /tmp/downpour-project
          cat >> /tmp/downpour-project/silent_hill_downpour_manifest.toml <<'TOML'

          [entrypoint.functions."0x830D2388"]

          [entrypoint.functions."0x830E82F0"]
          TOML
          sdk/out/linux-amd64/rexglue codegen /tmp/downpour-project/silent_hill_downpour_manifest.toml
          rm -rf _private_downpour_assets /tmp/downpour-game

      - name: Configure Downpour for Switch
        run: |
          set -o pipefail
          cmake -S /tmp/downpour-project -B /tmp/downpour-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tools/switch/cmake/switch-devkitA64.cmake" \
            -DREXSDK_DIR="$GITHUB_WORKSPACE/sdk" \
            -DREXGLUE_SWITCH_NVK_SDK=/tmp/nvk-sdk/nvk-sdk \
            2>&1 | tee /tmp/downpour-switch-cmake.log

      - name: Build Downpour Switch
        run: |
          set -o pipefail
          cmake --build /tmp/downpour-build -j 2 2>&1 | tee /tmp/downpour-switch-build.log

      - name: Upload Switch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downpour-switch-diagnostics
          path: |
            /tmp/downpour-switch-cmake.log
            /tmp/downpour-switch-build.log
            /tmp/downpour-build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Downpour NRO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: silent-hill-downpour-switch
          path: /tmp/downpour-build/**/*.nro
          if-no-files-found: error
          retention-days: 7
