name: Downpour - ReXGlue host

on:
  workflow_dispatch:
  push:
    branches:
      - downpour-port
    paths:
      - ".github/workflows/downpour-rexglue.yml"
      - "sdk/**"
      - "tools/fetch_thirdparty.py"

jobs:
  build-rexglue-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 git wget lsb-release software-properties-common gnupg libgtk-3-dev

      - name: Install LLVM 20
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          echo "CC=clang-20" >> "$GITHUB_ENV"
          echo "CXX=clang++-20" >> "$GITHUB_ENV"

      - name: Show tool versions
        run: |
          "$CC" --version
          "$CXX" --version
          cmake --version
          ninja --version
          python3 --version

      - name: Fetch ReXGlue third-party sources
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          # Some SDK submodules are large. Avoid parallel recursive fetches on the hosted runner.
          git config --global protocol.version 2
          git config --global http.version HTTP/1.1
          git config --global submodule.fetchJobs 1
          set -o pipefail
          python3 tools/fetch_thirdparty.py 2>&1 | tee /tmp/rexglue-thirdparty.log

      - name: Upload dependency log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rexglue-thirdparty-log
          path: /tmp/rexglue-thirdparty.log
          if-no-files-found: ignore

      - name: Configure ReXGlue host
        run: |
          set -o pipefail
          cmake -S sdk -B out/host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" 2>&1 | tee /tmp/rexglue-cmake.log

      - name: Upload CMake log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rexglue-cmake-log
          path: |
            /tmp/rexglue-cmake.log
            out/host/CMakeFiles/CMakeConfigureLog.yaml
            out/host/CMakeFiles/CMakeError.log
            out/host/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore

      - name: Build ReXGlue code generator
        run: cmake --build out/host --target rexglue -j 2

      - name: Verify rexglue
        run: |
          test -x out/host/rexglue
          ls -lh out/host/rexglue

      - name: Upload ReXGlue host artifact
        uses: actions/upload-artifact@v4
        with:
          name: rexglue-linux-host
          path: out/host/rexglue
          if-no-files-found: error
          retention-days: 7
