# build-trigger: cxx17-host
name: Downpour - ReXGlue host

on:
  workflow_dispatch:
  push:
    branches:
      - downpour-port
    paths:
      - ".github/workflows/downpour-rexglue.yml"
      - "sdk/**"
      - "tools/fetch_thirdparty.py"

jobs:
  build-rexglue-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build cmake python3 git wget lsb-release software-properties-common gnupg \
            build-essential pkg-config libgtk-3-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libjack-jackd2-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxext-dev libxss-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxrandr-dev libxrender-dev libxtst-dev \
            libwayland-dev libwayland-egl-backend-dev libxkbcommon-dev libdecor-0-dev \
            liburing-dev libdbus-1-dev libudev-dev libusb-1.0-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libunwind-dev

      - name: Install LLVM 20
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          echo "CC=clang-20" >> "$GITHUB_ENV"
          echo "CXX=clang++-20" >> "$GITHUB_ENV"

      - name: Show tool versions
        run: |
          "$CC" --version
          "$CXX" --version
          cmake --version
          ninja --version
          python3 --version

      - name: Fetch ReXGlue third-party sources
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          # Some SDK submodules are large. Avoid parallel recursive fetches on the hosted runner.
          git config --global protocol.version 2
          git config --global http.version HTTP/1.1
          git config --global submodule.fetchJobs 1
          set -o pipefail
          python3 tools/fetch_thirdparty.py 2>&1 | tee /tmp/rexglue-thirdparty.log
          # Pin SPIRV-Headers to the exact revision recorded by ReXGlue v0.10.0.
          # The port's third-party overlay can otherwise leave this module incomplete.
          rm -rf sdk/thirdparty/spirv-headers
          git clone --quiet https://github.com/KhronosGroup/SPIRV-Headers.git sdk/thirdparty/spirv-headers
          git -C sdk/thirdparty/spirv-headers checkout --quiet 29981f65241605e08b0ede4cfeb999fe3b723c6a

          # The SDK CMake checks for a .git marker to decide whether each
          # vendored dependency is initialized. fetch_thirdparty.py copies
          # source files intentionally without Git metadata, so add harmless
          # directory markers for those checks.
          python3 - <<'PY'
          from pathlib import Path
          root = Path("sdk/thirdparty")
          for child in root.iterdir():
              if child.is_dir() and any(child.iterdir()):
                  (child / ".git").mkdir(exist_ok=True)
          PY

      - name: Upload dependency log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rexglue-thirdparty-log
          path: /tmp/rexglue-thirdparty.log
          if-no-files-found: ignore

      - name: Configure ReXGlue host
        run: |
          set -o pipefail
          cmake -S sdk -B out/host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DSDL_WAYLAND=OFF \
            -DSDL_X11=ON \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF \
            -DSDL_INSTALL=OFF \
            2>&1 | tee /tmp/rexglue-cmake.log

      - name: Upload CMake log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rexglue-cmake-log
          path: |
            /tmp/rexglue-cmake.log
            out/host/CMakeFiles/CMakeConfigureLog.yaml
            out/host/CMakeFiles/CMakeError.log
            out/host/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore

      - name: Build ReXGlue code generator
        run: |
          set -o pipefail
          cmake --build out/host --target rexglue -j 2 2>&1 | tee /tmp/rexglue-build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rexglue-build-log
          path: /tmp/rexglue-build.log
          if-no-files-found: ignore

      - name: Verify rexglue
        run: |
          test -x sdk/out/linux-amd64/rexglue
          ls -lh sdk/out/linux-amd64/rexglue

      - name: Upload ReXGlue host artifact
        uses: actions/upload-artifact@v4
        with:
          name: rexglue-linux-host
          path: sdk/out/linux-amd64/rexglue
          if-no-files-found: error
          retention-days: 7


      - name: Checkout private Downpour assets
        uses: actions/checkout@v4
        with:
          repository: gerisson1996/-downpour-assets
          token: ${{ secrets.DOWNPOUR_ASSETS_TOKEN }}
          path: _private_downpour_assets
          fetch-depth: 1
          persist-credentials: false

      - name: Validate private Downpour XEX
        run: |
          set -euo pipefail
          install -m 600 _private_downpour_assets/default.xex /tmp/Default.xex
          echo "c686cbff8facad6fb6b78ed98e5a5a2f4f19337ef83517f56195a56b0db2c8d7  /tmp/Default.xex" | sha256sum -c -
          rm -rf _private_downpour_assets

      - name: Initialize Silent Hill Downpour project
        run: |
          set -euo pipefail
          rm -rf /tmp/downpour-project
          mkdir -p /tmp/downpour-game /tmp/downpour-project
          cp /tmp/Default.xex /tmp/downpour-game/default.xex
          sdk/out/linux-amd64/rexglue init \
            --project-name silent_hill_downpour \
            --xex-path /tmp/downpour-game/default.xex \
            --game-root /tmp/downpour-game \
            --project-root /tmp/downpour-project

          # The automatic scanner leaves two direct branch targets outside any
          # discovered function. Seed those exact entrypoints while keeping
          # call-graph validation enabled.
          cat >> /tmp/downpour-project/silent_hill_downpour_manifest.toml <<'TOML'

          [entrypoint.functions."0x830D2388"]

          [entrypoint.functions."0x830E82F0"]
          TOML

      - name: Run Downpour codegen
        run: |
          set -o pipefail
          sdk/out/linux-amd64/rexglue -v codegen \
            /tmp/downpour-project/silent_hill_downpour_manifest.toml \
            2>&1 | tee /tmp/downpour-codegen.log

      - name: Upload Downpour codegen diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downpour-codegen-diagnostics
          path: /tmp/downpour-codegen.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload generated Downpour project
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: downpour-generated-project
          path: |
            /tmp/downpour-project/CMakeLists.txt
            /tmp/downpour-project/CMakePresets.json
            /tmp/downpour-project/src
            /tmp/downpour-project/generated
            /tmp/downpour-project/silent_hill_downpour_manifest.toml
          if-no-files-found: error
          retention-days: 7

      - name: Remove private game binary
        if: always()
        run: |
          rm -f /tmp/Default.xex /tmp/downpour-game/default.xex
