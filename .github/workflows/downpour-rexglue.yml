name: Downpour - ReXGlue host

on:
  workflow_dispatch:
  push:
    branches:
      - downpour-port
    paths:
      - ".github/workflows/downpour-rexglue.yml"
      - "sdk/**"
      - "tools/fetch_thirdparty.py"

jobs:
  build-rexglue-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 git wget lsb-release software-properties-common gnupg

      - name: Install LLVM 20
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          echo "CC=clang-20" >> "$GITHUB_ENV"
          echo "CXX=clang++-20" >> "$GITHUB_ENV"

      - name: Show tool versions
        run: |
          "$CC" --version
          "$CXX" --version
          cmake --version
          ninja --version
          python3 --version

      - name: Fetch ReXGlue third-party sources
        run: python3 tools/fetch_thirdparty.py

      - name: Configure ReXGlue host
        run: |
          cmake -S sdk -B out/host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX"

      - name: Build ReXGlue code generator
        run: cmake --build out/host --target rexglue -j 2

      - name: Verify rexglue
        run: |
          test -x out/host/rexglue
          ls -lh out/host/rexglue

      - name: Upload ReXGlue host artifact
        uses: actions/upload-artifact@v4
        with:
          name: rexglue-linux-host
          path: out/host/rexglue
          if-no-files-found: error
          retention-days: 7
